org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# Disable Kotlin incremental compilation: pub cache (C:) and project (D:) on
# different drives breaks Kotlin's RelocatableFileToPathConverter on Windows.
kotlin.incremental=false
