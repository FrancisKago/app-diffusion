publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  shared:
    path: ../../packages/shared
  connectivity_plus: ^6.1.0
  crypto: ^3.0.5
  dio: ^5.7.0
  drift: ^2.21.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
